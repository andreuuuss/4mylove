<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Mar 🌻</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --intro-bg: #fff3c4;
    --intro-bg2: #ffd94a;
    --intro-fg: #3b2a00;
    --stage-bg: #000000;
    --gold: #ffd21f;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --intro-bg: #1b1400;
      --intro-bg2: #3d2e00;
      --intro-fg: #ffd21f;
    }
  }
  :root[data-theme="dark"] {
    --intro-bg: #1b1400;
    --intro-bg2: #3d2e00;
    --intro-fg: #ffd21f;
  }
  html { height: 100%; overflow: hidden; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg);
    font-family: 'Dancing Script', 'Segoe Script', 'Brush Script MT', cursive, Georgia, serif;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Intro ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 5;
    width: 100%; border: 0; margin: 0;
    padding: env(safe-area-inset-top, 0px) 1rem env(safe-area-inset-bottom, 0px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
    background: radial-gradient(circle at 50% 42%, var(--intro-bg2), var(--intro-bg) 72%);
    color: var(--intro-fg);
    font: inherit; cursor: pointer;
    transition: opacity 1s ease;
  }
  #intro.hide { opacity: 0; pointer-events: none; }
  .intro-flower { font-size: clamp(4.5rem, 20vw, 8.5rem); animation: float 3s ease-in-out infinite; line-height: 1; }
  .intro-text { font-size: clamp(2.2rem, 9vw, 3.8rem); font-weight: 700; animation: pulse 1.8s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-12px) rotate(4deg); } }
  @keyframes pulse { 0%,100% { opacity: .55; transform: scale(.97); } 50% { opacity: 1; transform: scale(1.04); } }

  /* ---------- Escenario negro ---------- */
  #stage {
    position: fixed; inset: 0; z-index: 2;
    padding: env(safe-area-inset-top, 0px) 1rem env(safe-area-inset-bottom, 0px);
    background: var(--stage-bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2rem;
    overflow: hidden;
  }
  #stage.boom { animation: boom .5s ease-out; }
  @keyframes boom {
    0% { transform: translate(0,0); } 20% { transform: translate(-9px,6px); } 40% { transform: translate(8px,-7px); }
    60% { transform: translate(-6px,-4px); } 80% { transform: translate(4px,3px); } 100% { transform: none; }
  }
  #c { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

  #msg {
    position: relative; z-index: 2;
    max-width: 34rem; text-align: center;
    color: var(--gold);
    font-size: clamp(1.5rem, 5.6vw, 2.6rem);
    line-height: 1.35;
    text-shadow: 0 0 10px rgba(255,210,31,.55), 0 0 30px rgba(255,170,0,.28);
    transition: opacity .9s ease;
  }
  #msg.out { opacity: 0; }
  #msg p { margin: .4em 0; min-height: 1.35em; }
  #msg p.typing::after { content: '|'; margin-left: 3px; animation: blink .8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  #go {
    position: relative; z-index: 2;
    font: inherit; font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 700;
    padding: .45em 1.8em; border-radius: 999px;
    border: 2px solid var(--gold); background: transparent; color: var(--gold);
    cursor: pointer;
    box-shadow: 0 0 18px rgba(255,210,31,.35), inset 0 0 12px rgba(255,210,31,.15);
    opacity: 0; visibility: hidden; transform: translateY(10px);
    transition: opacity .9s ease, transform .9s ease, visibility .9s, background .25s, color .25s;
  }
  #go.show { opacity: 1; visibility: visible; transform: none; }
  #go:hover, #go:focus-visible { background: var(--gold); color: #000; outline: none; }

  #final {
    position: absolute; left: 0; right: 0; top: 50%; z-index: 3;
    text-align: center; pointer-events: none;
    font-size: clamp(4.8rem, 26vw, 12rem); font-weight: 700; line-height: 1;
    color: var(--gold);
    text-shadow: 0 0 14px rgba(255,210,31,.8), 0 0 42px rgba(255,170,0,.55), 0 0 90px rgba(255,140,0,.35);
    opacity: 0; transform: translateY(-50%) scale(.2);
    transition: opacity 1.2s ease, transform 1.5s cubic-bezier(.2, 1.4, .4, 1);
  }
  #final.show { opacity: 1; transform: translateY(-50%) scale(1); animation: glow 2.6s ease-in-out 1.6s infinite; }
  @keyframes glow {
    0%,100% { text-shadow: 0 0 14px rgba(255,210,31,.8), 0 0 42px rgba(255,170,0,.55), 0 0 90px rgba(255,140,0,.35); }
    50% { text-shadow: 0 0 22px rgba(255,225,80,1), 0 0 64px rgba(255,190,0,.8), 0 0 130px rgba(255,150,0,.5); }
  }

  #replay {
    position: absolute; left: 50%; z-index: 4;
    bottom: calc(1.1rem + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    font: inherit; font-size: 1.15rem;
    padding: .3em 1.1em; border-radius: 999px;
    border: 1px solid rgba(255,210,31,.4); background: transparent; color: rgba(255,210,31,.75);
    cursor: pointer;
    opacity: 0; visibility: hidden; transition: opacity 1s ease, visibility 1s;
  }
  #replay.show { opacity: 1; visibility: visible; }
  #replay:hover, #replay:focus-visible { color: #ffd21f; border-color: #ffd21f; outline: none; }
</style>
</head>
<body>

<button id="intro" type="button" aria-label="Haz clic para comenzar">
  <span class="intro-flower">🌻</span>
  <span class="intro-text">Haz clic</span>
</button>

<main id="stage">
  <canvas id="c"></canvas>
  <div id="msg" aria-live="polite"></div>
  <button id="go" type="button">Empezar</button>
  <div id="final">Te amo</div>
  <button id="replay" type="button">Volver a ver</button>
</main>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var intro = $('intro'), stage = $('stage'), msg = $('msg'), go = $('go'),
      finalEl = $('final'), replay = $('replay');
  var cv = $('c'), ctx = cv.getContext('2d');

  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var clamp = function (x, a, b) { a = a === undefined ? 0 : a; b = b === undefined ? 1 : b; return Math.min(b, Math.max(a, x)); };
  var easeOut = function (x) { return 1 - Math.pow(1 - x, 3); };
  var rand = function (a, b) { return a + Math.random() * (b - a); };
  var pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };
  var TAU = Math.PI * 2;

  /* ============ 1) Mensaje con efecto máquina de escribir ============ */
  var LINES = [
    'Mar, eres mi persona especial,',
    'tengo tanto que decirte',
    'y sé que no te gustan las flores, así que...',
    'he decidido hacer algo más yo',
    'y pues...'
  ];

  async function typeMessage() {
    for (var i = 0; i < LINES.length; i++) {
      var line = LINES[i];
      var p = document.createElement('p');
      p.className = 'typing';
      msg.appendChild(p);
      for (var j = 0; j < line.length; j++) {
        var ch = line[j];
        p.textContent += ch;
        var d = 55;
        if (ch === ',') d = 320;
        else if (ch === '.') d = 300;
        await sleep(d + rand(-10, 22));
      }
      p.classList.remove('typing');
      await sleep(500);
    }
    await sleep(400);
    go.classList.add('show');
    go.focus({ preventScroll: true });
  }

  intro.addEventListener('click', async function () {
    intro.classList.add('hide');
    await sleep(1200);
    typeMessage();
  }, { once: true });

  go.addEventListener('click', function () {
    go.classList.remove('show');
    msg.classList.add('out');
    startBouquet();
  }, { once: true });

  /* ============ 2) Ramo de girasoles en canvas ============ */
  var W, H, dpr, u, bx, by;
  var flowers = [], heads = [];
  var particles = [];
  var active = false, exploded = false;
  var t0 = 0, last = 0, ambientAcc = 0;

  var T_SHAKE = 9200, T_EXP = 10600;

  // [dx, dy, radio] en unidades u; dy = altura sobre la base del ramo
  var SPEC = [
    [0, .80, .125], [-.23, .72, .115], [.23, .72, .115],
    [-.11, .60, .12], [.12, .62, .12],
    [-.40, .56, .105], [.40, .56, .105],
    [-.25, .47, .10], [.26, .48, .10],
    [0, .46, .10]
  ];
  var ORDER = [5, 6, 7, 8, 9, 3, 4, 1, 2, 0]; // orden en que van floreciendo
  var RND = SPEC.map(function () { return { spin: rand(0, TAU) }; });

  var SEEDS = [];
  (function () {
    var n = 80;
    for (var k = 1; k <= n; k++) {
      var r = Math.sqrt(k / n), a = k * 2.399963;
      SEEDS.push({ x: r * Math.cos(a), y: r * Math.sin(a), r: r, alt: k % 2 === 0 });
    }
  })();

  var LEAVES = [{ t: .60, side: 1, len: .085 }, { t: .75, side: -1, len: .075 }];
  var FAN = [];
  for (var k = 0; k < 9; k++) {
    FAN.push({ a: (-165 + k * 18.75) * Math.PI / 180, len: .27 + .055 * (k % 3) });
  }
  var PETALS = ['#ffd21f', '#ffbf00', '#ffe14d', '#f5a800'];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    u = Math.min(W * .95, H * .68);
    bx = W / 2; by = H * .9;
    buildFlowers();
  }

  function buildFlowers() {
    flowers = SPEC.map(function (s, i) {
      var dx = s[0], dy = s[1], rr = s[2];
      var hx = bx + dx * u, hy = by - dy * u;
      return {
        i: i, dx: dx, dy: dy, r: rr, hx: hx, hy: hy, g: 0,
        p0: { x: bx + dx * .04 * u, y: by - .02 * u },
        p1: { x: bx + dx * .12 * u, y: by - dy * .5 * u },
        p2: { x: hx - dx * .10 * u, y: hy + dy * .22 * u },
        p3: { x: hx, y: hy },
        delay: 900 + ORDER.indexOf(i) * 520,
        lean: dx * .7, squash: 1 - Math.abs(dx) * .28, spin: RND[i].spin
      };
    });
    heads = flowers.slice().sort(function (a, b) { return b.dy - a.dy; });
  }

  function bez(f, t) {
    var m = 1 - t, a = m * m * m, b = 3 * m * m * t, c = 3 * m * t * t, d = t * t * t;
    return {
      x: a * f.p0.x + b * f.p1.x + c * f.p2.x + d * f.p3.x,
      y: a * f.p0.y + b * f.p1.y + c * f.p2.y + d * f.p3.y
    };
  }

  function leaf(x, y, ang, len, wr, col) {
    if (len < 1) return;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(ang);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(len * .5, -len * wr, len, 0);
    ctx.quadraticCurveTo(len * .5, len * wr, 0, 0);
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len * .92, 0); ctx.stroke();
    ctx.restore();
  }

  function petalPath(len, wid, inner) {
    ctx.beginPath();
    ctx.moveTo(0, -inner);
    ctx.bezierCurveTo(wid, -len * .45, wid * .7, -len * .9, 0, -len);
    ctx.bezierCurveTo(-wid * .7, -len * .9, -wid, -len * .45, 0, -inner);
    ctx.closePath();
  }

  function petalRing(R, n, off, c1, c2, inner) {
    var g = ctx.createLinearGradient(0, -inner, 0, -R);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g;
    ctx.strokeStyle = 'rgba(120,70,0,.35)';
    ctx.lineWidth = Math.max(.5, R * .012);
    for (var k = 0; k < n; k++) {
      ctx.save();
      ctx.rotate(off + k * TAU / n);
      petalPath(R, R * .2, inner);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  function drawStem(f, t) {
    var g = easeOut(clamp((t - f.delay) / 1500));
    f.g = g;
    if (g <= 0) return;
    var n = Math.max(2, Math.ceil(28 * g));
    var p = bez(f, 0);
    ctx.beginPath(); ctx.moveTo(p.x, p.y);
    for (var i = 1; i <= n; i++) { p = bez(f, g * i / n); ctx.lineTo(p.x, p.y); }
    ctx.lineWidth = u * .013; ctx.strokeStyle = '#3f8f2e';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.stroke();
    for (var l = 0; l < LEAVES.length; l++) {
      var L = LEAVES[l];
      if (g > L.t) {
        var s = easeOut(clamp((g - L.t) / .3));
        var q = bez(f, L.t), q2 = bez(f, L.t + .02);
        var side = L.side * (f.i % 2 ? 1 : -1);
        var ang = Math.atan2(q2.y - q.y, q2.x - q.x) + side * .95;
        leaf(q.x, q.y, ang, L.len * u * s, .34, '#4fa53a');
      }
    }
  }

  function drawHead(f, t) {
    if (f.g <= 0) return;
    var tip = bez(f, f.g);
    var b = clamp((t - f.delay - 1100) / 1500);
    // capullo
    ctx.fillStyle = '#3f8f2e';
    ctx.beginPath(); ctx.arc(tip.x, tip.y, u * .016, 0, TAU); ctx.fill();
    if (b <= 0) return;
    var R = f.r * u * easeOut(b);
    if (R < 1) return;
    ctx.save();
    ctx.translate(tip.x, tip.y);
    ctx.rotate(f.lean);
    ctx.scale(1, f.squash);
    ctx.rotate(f.spin + b * .5);
    var cr = R * .42;
    ctx.fillStyle = '#3f8f2e';
    ctx.beginPath(); ctx.arc(0, 0, cr * 1.15, 0, TAU); ctx.fill();
    petalRing(R, 18, 0, '#f0a000', '#ffd21f', cr * .8);
    petalRing(R * .92, 18, Math.PI / 18, '#f7b500', '#ffe45c', cr * .8);
    var dg = ctx.createRadialGradient(0, 0, 0, 0, 0, cr);
    dg.addColorStop(0, '#2a1606'); dg.addColorStop(.7, '#5b3510'); dg.addColorStop(1, '#8a5a1c');
    ctx.fillStyle = dg;
    ctx.beginPath(); ctx.arc(0, 0, cr, 0, TAU); ctx.fill();
    for (var i = 0; i < SEEDS.length; i++) {
      var s = SEEDS[i];
      ctx.fillStyle = s.alt ? 'rgba(255,200,90,.35)' : 'rgba(15,8,2,.55)';
      ctx.beginPath();
      ctx.arc(s.x * cr * .95, s.y * cr * .95, cr * .05 * (.6 + s.r * .6), 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawBow(cx, cy, s) {
    ctx.fillStyle = '#d63a2b'; ctx.strokeStyle = '#a32418'; ctx.lineWidth = 1.2;
    // colas
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.lineTo(cx - s * .9, cy + s * 1.6); ctx.lineTo(cx - s * .35, cy + s * 1.35); ctx.lineTo(cx, cy + s * .2);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.lineTo(cx + s * .9, cy + s * 1.6); ctx.lineTo(cx + s * .35, cy + s * 1.35); ctx.lineTo(cx, cy + s * .2);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // lazos
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.bezierCurveTo(cx - s * 1.3, cy - s * 1.3, cx - s * 1.8, cy + s * .5, cx, cy);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.bezierCurveTo(cx + s * 1.3, cy - s * 1.3, cx + s * 1.8, cy + s * .5, cx, cy);
    ctx.fill(); ctx.stroke();
    // nudo
    ctx.beginPath(); ctx.arc(cx, cy, s * .3, 0, TAU); ctx.fill(); ctx.stroke();
  }

  function drawWrapper(t) {
    var p = easeOut(clamp(t / 1100));
    if (p <= 0) return;
    ctx.save();
    ctx.globalAlpha = p;
    ctx.translate(bx, by); ctx.scale(1, .5 + .5 * p); ctx.translate(-bx, -by);
    var hw0 = .035 * u, hw1 = .30 * u, H1 = .36 * u;
    var g = ctx.createLinearGradient(bx - hw1, 0, bx + hw1, 0);
    g.addColorStop(0, '#e9cf8e'); g.addColorStop(.5, '#f4e2b0'); g.addColorStop(1, '#c9a25a');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(bx - hw0, by); ctx.lineTo(bx + hw0, by); ctx.lineTo(bx + hw1, by - H1);
    ctx.quadraticCurveTo(bx, by - H1 * .82, bx - hw1, by - H1);
    ctx.closePath(); ctx.fill();
    // pliegues
    ctx.fillStyle = 'rgba(120,70,15,.22)';
    ctx.beginPath(); ctx.moveTo(bx + hw0, by); ctx.lineTo(bx + hw1, by - H1); ctx.lineTo(bx + .05 * u, by - .28 * u); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.22)';
    ctx.beginPath(); ctx.moveTo(bx - hw0, by); ctx.lineTo(bx - hw1, by - H1); ctx.lineTo(bx - .06 * u, by - .29 * u); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(120,80,20,.35)'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(bx, by); ctx.lineTo(bx - .12 * u, by - .33 * u);
    ctx.moveTo(bx, by); ctx.lineTo(bx + .14 * u, by - .33 * u);
    ctx.stroke();
    // listón
    var h = .13 * u, th = .03 * u;
    var wA = hw0 + (hw1 - hw0) * (h / H1), wB = hw0 + (hw1 - hw0) * ((h + th) / H1);
    ctx.fillStyle = '#d63a2b';
    ctx.beginPath();
    ctx.moveTo(bx - wB, by - h - th); ctx.lineTo(bx + wB, by - h - th);
    ctx.lineTo(bx + wA, by - h); ctx.lineTo(bx - wA, by - h);
    ctx.closePath(); ctx.fill();
    drawBow(bx, by - h - th / 2, .05 * u);
    ctx.restore();
  }

  function drawBouquet(t) {
    var bloomProg = clamp((t - 900) / 6500);
    var shakeK = t > T_SHAKE ? clamp((t - T_SHAKE) / (T_EXP - T_SHAKE)) : 0;

    // resplandor detrás del ramo
    var ga = .10 * bloomProg + .38 * shakeK * shakeK;
    if (ga > 0) {
      var gr = ctx.createRadialGradient(bx, by - .5 * u, 0, bx, by - .5 * u, u * .8);
      gr.addColorStop(0, 'rgba(255,200,40,' + ga + ')');
      gr.addColorStop(1, 'rgba(255,200,40,0)');
      ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    }

    var sway = Math.sin(t / 900) * .012 * clamp((t - 800) / 1500);
    var jx = 0, jy = 0, sc = 1;
    if (shakeK > 0) {
      sway += Math.sin(t / 25) * .022 * shakeK;
      jx = (Math.random() - .5) * 8 * shakeK;
      jy = (Math.random() - .5) * 8 * shakeK;
      sc = 1 + .08 * shakeK * shakeK + Math.sin(t / 60) * .01 * shakeK;
    }

    ctx.save();
    ctx.translate(bx + jx, by + jy); ctx.rotate(sway); ctx.scale(sc, sc); ctx.translate(-bx, -by);

    // hojas de relleno
    var fp = easeOut(clamp((t - 300) / 1800));
    for (var k = 0; k < FAN.length; k++) {
      leaf(bx, by - .3 * u, FAN[k].a, FAN[k].len * u * fp, .3, k % 2 ? '#2f7a28' : '#3a8f2f');
    }
    for (var i = 0; i < flowers.length; i++) drawStem(flowers[i], t);
    drawWrapper(t);
    for (var j = 0; j < heads.length; j++) drawHead(heads[j], t);

    ctx.restore();
  }

  /* ============ 3) Explosión y partículas ============ */
  function explode() {
    exploded = true;
    var sc = 1.08, us = u / 600;
    var P = function (x) { return bx + (x - bx) * sc; };
    var Q = function (y) { return by + (y - by) * sc; };

    flowers.forEach(function (f) {
      var x = P(f.hx), y = Q(f.hy), R = f.r * u * sc;
      var k;
      for (k = 0; k < 26; k++) {
        var a = rand(0, TAU), sp = rand(180, 760) * us;
        particles.push({
          type: 'petal', x: x + Math.cos(a) * R * .4, y: y + Math.sin(a) * R * .4,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - rand(80, 260) * us,
          rot: rand(0, TAU), vr: rand(-6, 6), flip: rand(0, TAU), vf: rand(4, 9),
          size: R * rand(.35, .55), life: 0, max: rand(3.2, 5),
          grav: rand(260, 420) * us, drag: 1.1, col: pick(PETALS)
        });
      }
      for (k = 0; k < 14; k++) {
        var a2 = rand(0, TAU), sp2 = rand(120, 520) * us;
        particles.push({
          type: 'dot', x: x, y: y, vx: Math.cos(a2) * sp2, vy: Math.sin(a2) * sp2 - 100 * us,
          rot: 0, vr: 0, size: R * rand(.04, .08), life: 0, max: rand(2.2, 3.6),
          grav: 420 * us, drag: .9, col: pick(['#3b2208', '#5b3510', '#8a5a1c'])
        });
      }
    });

    var k2;
    for (k2 = 0; k2 < 18; k2++) {
      var ap = rand(0, TAU), spp = rand(160, 620) * us;
      particles.push({
        type: 'paper', x: bx + rand(-.2, .2) * u, y: by - rand(0, .34) * u,
        vx: Math.cos(ap) * spp, vy: Math.sin(ap) * spp - 160 * us,
        rot: rand(0, TAU), vr: rand(-7, 7), flip: rand(0, TAU), vf: rand(3, 8),
        size: u * rand(.02, .05), life: 0, max: rand(2.6, 4.2),
        grav: 520 * us, drag: .8, col: pick(['#e9cf8e', '#c9a25a', '#f4e2b0', '#d63a2b'])
      });
    }
    for (k2 = 0; k2 < 14; k2++) {
      var al = rand(0, TAU), spl = rand(160, 620) * us;
      particles.push({
        type: 'leaf', x: bx + rand(-.25, .25) * u, y: by - rand(.2, .45) * u,
        vx: Math.cos(al) * spl, vy: Math.sin(al) * spl - 140 * us,
        rot: rand(0, TAU), vr: rand(-5, 5), size: u * rand(.05, .09), life: 0, max: rand(3, 4.6),
        grav: 380 * us, drag: 1, col: pick(['#2f7a28', '#3a8f2f', '#4fa53a'])
      });
    }
    for (k2 = 0; k2 < 170; k2++) {
      var as = rand(0, TAU), sps = rand(220, 1150) * us;
      particles.push({
        type: 'spark', x: bx, y: by - .55 * u,
        vx: Math.cos(as) * sps, vy: Math.sin(as) * sps,
        rot: 0, vr: 0, size: rand(1.2, 3.2), life: 0, max: rand(.7, 1.9),
        grav: 0, drag: 2, col: pick(['#fff2a8', '#ffd21f', '#ffb300'])
      });
    }

    stage.classList.add('boom');
    setTimeout(function () { stage.classList.remove('boom'); }, 600);
    setTimeout(function () { finalEl.classList.add('show'); }, 650);
    setTimeout(function () { replay.classList.add('show'); }, 6500);
  }

  function spawnAmbient() {
    var us = u / 600;
    particles.push({
      type: 'petal', x: rand(0, W), y: -30,
      vx: rand(-15, 15), vy: rand(60, 130) * Math.max(us, .6),
      rot: rand(0, TAU), vr: rand(-2, 2), flip: rand(0, TAU), vf: rand(2, 5),
      size: u * rand(.03, .05), life: 0, max: rand(7, 11),
      grav: 0, drag: 0, col: pick(PETALS), sw: rand(20, 50), swp: rand(0, TAU)
    });
  }

  function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life += dt;
      if (p.life >= p.max) { particles.splice(i, 1); continue; }
      var d = Math.exp(-p.drag * dt);
      p.vx *= d; p.vy = p.vy * d + p.grav * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.sw) p.x += Math.sin(p.life * 1.6 + p.swp) * p.sw * dt;
      p.rot += p.vr * dt;
      if (p.vf) p.flip += p.vf * dt;
    }
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var a = clamp((p.max - p.life) / .9);
      ctx.save();
      ctx.globalAlpha = a;
      if (p.type === 'spark') {
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = p.col;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
      } else if (p.type === 'dot') {
        ctx.fillStyle = p.col;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
      } else if (p.type === 'petal') {
        ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(Math.cos(p.flip), 1);
        ctx.translate(0, p.size / 2);
        ctx.fillStyle = p.col;
        petalPath(p.size, p.size * .22, 0); ctx.fill();
      } else if (p.type === 'paper') {
        ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(Math.cos(p.flip), 1);
        ctx.fillStyle = p.col;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .8);
      } else if (p.type === 'leaf') {
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.restore(); ctx.save(); ctx.globalAlpha = a;
        leaf(p.x, p.y, p.rot, p.size, .34, p.col);
      }
      ctx.restore();
    }
  }

  function drawAfter(dt, k) {
    // destello
    if (k < 600) {
      ctx.fillStyle = 'rgba(255,235,140,' + (.75 * (1 - k / 600)) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    // ondas de choque
    var delays = [0, 140];
    for (var i = 0; i < delays.length; i++) {
      var kk = clamp((k - delays[i]) / 1000);
      if (kk > 0 && kk < 1) {
        ctx.beginPath();
        ctx.arc(bx, by - .55 * u, u * (.15 + .95 * easeOut(kk)), 0, TAU);
        ctx.lineWidth = 10 * (1 - kk) + 1;
        ctx.strokeStyle = 'rgba(255,220,80,' + ((1 - kk) * .9) + ')';
        ctx.stroke();
      }
    }
    // lluvia suave de pétalos
    if (k > 1800) {
      ambientAcc += dt;
      if (ambientAcc > .16 && particles.length < 320) { ambientAcc = 0; spawnAmbient(); }
    }
    updateParticles(dt);
    drawParticles();
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (!active) return;
    var dt = Math.min(.05, (now - last) / 1000);
    last = now;
    var t = now - t0;
    ctx.clearRect(0, 0, W, H);
    if (t < T_EXP) {
      drawBouquet(t);
    } else {
      if (!exploded) explode();
      drawAfter(dt, t - T_EXP);
    }
  }

  function startBouquet() {
    resize();
    exploded = false;
    particles.length = 0;
    ambientAcc = 0;
    t0 = performance.now() + 700;
    last = performance.now();
    active = true;
  }

  replay.addEventListener('click', function () {
    finalEl.classList.remove('show');
    replay.classList.remove('show');
    particles.length = 0;
    exploded = false;
    ambientAcc = 0;
    t0 = performance.now() + 300;
    last = performance.now();
  });

  window.addEventListener('resize', function () { if (W) resize(); });
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
